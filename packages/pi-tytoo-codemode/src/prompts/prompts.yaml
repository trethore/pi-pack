tool:
  code: JavaScript source code.
  snippet: Run JavaScript that calls other tools
  guidelines:
    - Use Promise.allSettled() for independent tool calls. Run dependent calls in order.
    - Filter large results before you print them.
    - Await every call you need. When the script ends, pending calls receive an abort signal. Earlier tool actions are not undone.
  description: |-
    Run JavaScript in QuickJS. Use source code, not JSON or Markdown code fences. Top-level `await` and `return` work.
    Scripts have no direct access to Node.js APIs, files, networks, or timers.
    `await tools.<name>(args)` returns text or declared structured output. Calls can throw errors. Structured error results can return normally. Check fields such as `isError`.
    Optional first line: `// @options: {"max_output_tokens": 10000}`
    `max_output_tokens` sets an estimated text budget. Optional `timeout_ms` sets a deadline for the whole script. By default, no deadline is set.
  globals: |-
    Globals:
    - `text(value)`, `console.log(...)`, and `return value` print output. `exit()` ends the script.
    - `image(value)` shows an image from a base64 data URL or image block. The result includes a saved file path or a save error.
    - `store(key, value)` and `load(key)` keep small JSON values across calls. Writes persist only when the script succeeds.
    - `ALL_TOOLS` lists tools available to this script. Find tools with `searchTools(query, options)`. Optional search fields: `limit`, `namespace`.
    - Get tool or namespace details with `await describeTool(name)` or `await describeNamespace(name)`.
    - Print discovery results: `text(await searchTools("query"))`.
  models: "- `models`: classifiers and image generation. Before you use `models`, read {{docsPath}}."
  sharedMcpTypes: |-
    Shared MCP Types:
    ```ts
  stringOutput: a string
  scriptCall: "Codemode: `tools.{{name}}(args)` resolves to {{output}}."
  nestedTools: "Nested tools:"
  toolsNotListed: " (tools not listed)"
  someToolsNotListed: " (some tools not listed)"
  declaration: |-
    {{description}}

    codemode tool declaration:
    ```ts
    {{declaration}}
    ```
results:
  toolFailed: Tool "{{name}}" failed
  scriptError: |-
    Script error:
    {{error}}
  unshownImages: "Note: models.generateImages() returned {{count}} image{{suffix}}, but the script showed none. Use image(block) for each image block in result.output."
  header: |
    {{status}}
    Wall time {{wallTime}} seconds
    Output:
  completed: Script completed
  failed: Script failed
  textItem: |-
    ==> text {{index}}/{{total}} <==
    {{text}}
  console: |-
    <console_output>
    {{lines}}
    </console_output>
  noCalls: No tool calls were made.
  partialFailure: "Earlier tool actions are not undone. Calls: {{calls}}"
  timedOut: "Script timed out: {{message}}"
  aborted: "Script aborted: {{message}}"
  sandboxFailed: "Script sandbox failed: {{message}}"
  truncatedWarning: "Warning: truncated output (estimated original tokens: {{tokens}})"
  lineCount: "Total output lines: {{count}}"
  truncatedBody: "{{head}}...about {{tokens}} tokens removed...{{tail}}"
  fullOutput: |-


    [Full output: {{path}} (read with offset/limit)]
  fullOutputFailed: |-


    [Could not save the full output: {{error}}]
  imageSaved: "[Image saved to {{path}} ({{kind}})]"
  imageSaveFailed: "[Image ({{kind}}) could not be saved: {{error}}]"
  outputLimit: Script output exceeded {{characters}} characters or {{items}} output calls. Print a summary. Use a tool to save large data to a file.
  stalled: The script is waiting for a promise that cannot settle. No tool call is pending. Timers are not available.
models:
  classifierContext: |-
    {
      state: {},
      questions: {
        check: {
          type: "bool",
          instructions: "Is the item valid?",
          criteria: { true: "Valid", false: "Invalid" }
        }
      }
    }
    For "choice", criteria maps each label to its meaning.
    For "score", criteria lists levels from lowest to highest.
    The optional images array contains blocks: { type: "image", data: "<base64>", mimeType: "image/png" }.
  lookupArguments: "{{name}}(type, provider, id) requires three strings. Received: ({{values}}). Pass provider and id as separate arguments."
  classifierError: |-
    {{name}}(): {{problem}}.
    Example context:
    {{shape}}
    See "Classify" in {{docsPath}}.
  imagesError: |-
    {{name}}(): {{problem}}.
    input must contain at least one text or image block.
    Example context: { input: [{ type: "text", text: "Draw a tree." }] }
    Image blocks use { type: "image", data: "<base64>", mimeType: "image/png" }.
    See "Generate images" in {{docsPath}}.
  listAvailable: Find available {{type}} models with {{name}}("{{type}}").
  unknownLookup: " {{name}}() returns undefined for an unknown provider or id."
  expectedModel: "{{name}}() requires {{type}} model as its first argument. Received {{value}}.{{undefinedHint}} {{listHint}}"
  wrongModelType: '"{{ref}}" is {{actualType}} model, not {{type}} model. {{listHint}}'
  unknownModel: Unknown {{type}} model "{{ref}}". {{listHint}}
  unknownType: Unknown model type {{value}}. Use "chat", "image", or "classifier".
discovery:
  toolHint: ALL_TOOLS lists tools available to this script. Use searchTools(query) to find a tool.
  missingMember: "{{label}}.{{property}} does not exist."
  suggestions: " Did you mean {{names}}?"
  available: " Available: {{names}}."
store:
  hint: Use store() for small JSON values, such as IDs or summaries. Show images with image(). Variables last only for this script. Use a tool to save large data to a file.
  valueTooLarge: store({{key}}) value has {{size}} characters of JSON. The limit is {{limit}}. {{hint}}
  full: "The store would exceed {{limit}} characters of JSON. Delete keys with store(key, undefined). {{hint}}"
images:
  expected: image() accepts a base64 data URL, an { image_url } object, or an image block. HTTP and HTTPS URLs are not supported.
  invalidDataUri: Invalid image data URL. Use data:<mimeType>;base64,<data>.
  remoteUrl: HTTP and HTTPS image URLs are not supported. Use a base64 data URL.
source:
  optionsObject: "@options must be a JSON object. Supported fields: {{fields}}."
  optionsJson: "Invalid @options JSON: {{error}}. Supported fields: {{fields}}."
  unsupportedOption: "Unsupported @options field `{{key}}`. Use {{fields}}."
  outputTokens: "@options field `max_output_tokens` must be a non-negative safe integer."
  timeout: "@options field `timeout_ms` must be a positive integer up to {{limit}} milliseconds."
  empty: Provide JavaScript source. Do not use JSON or Markdown code fences.
  missingCode: Put JavaScript source after the @options line.
