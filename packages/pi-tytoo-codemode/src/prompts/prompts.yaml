tool:
  code: Raw JavaScript source.
  snippet: Run JavaScript that calls other tools
  guidelines:
    - Use codemode to batch independent tool calls (Promise.allSettled), chain them, or filter large output, instead of many separate calls.
  description: |-
    Run JavaScript that calls other tools. The input is raw JavaScript (not JSON, no code fence), run as an async function body in a QuickJS sandbox: top-level `await` and `return` work. No Node, file system, network, or timers.
    - `await tools.<name>({ ...args })` resolves to a string, or an object if the tool's declaration says so, and rejects with an Error on failure. Calls still running when the script ends are cancelled.
    - Optional first line: `// @options: {"max_output_tokens": 10000, "timeout_ms": 60000}`
  globals: |-
    Globals:
    - `text(value)`, `image(dataUrlOrImageBlock)`, `console.log(...)`, and top-level `return` add output; `exit()` ends the script. With several text items, each starts with a `==> text N/M <==` line, and `console` lines follow the other output in one `<console_output>` block. `image()` also saves the image to a temp file and the result names its path.
    - `store(key, value)` and `load(key)` keep JSON values across codemode calls.
    - `ALL_TOOLS`, `await searchTools(query, { limit?, namespace? })`, `await describeTool(name)`, `await describeNamespace(name)`: find unlisted tools, such as MCP tools.
  models: "- `models`: classifiers and image generation. Read {{docsPath}} first."
  sharedMcpTypes: |-
    Shared MCP Types:
    ```ts
  stringOutput: a string
  scriptCall: "Codemode: `tools.{{name}}(args)` resolves to {{output}}."
  nestedTools: "Nested tools:"
  toolsNotListed: " (tools not listed)"
  someToolsNotListed: " (some tools not listed)"
  declaration: |-
    {{description}}

    codemode tool declaration:
    ```ts
    {{declaration}}
    ```
results:
  toolFailed: Tool "{{name}}" failed
  scriptError: |-
    Script error:
    {{error}}
  unshownImages: "Note: models.generateImages() returned {{count}} image{{suffix}} that the script did not show. Show each image block of result.output with image(block)."
  header: |
    {{status}}
    Wall time {{wallTime}} seconds
    Output:
  completed: Script completed
  failed: Script failed
  textItem: |-
    ==> text {{index}}/{{total}} <==
    {{text}}
  console: |-
    <console_output>
    {{lines}}
    </console_output>
  noCalls: No tool calls were made.
  partialFailure: "Tool calls made before the failure (they are not undone): {{calls}}"
  timedOut: "Script timed out: {{message}}"
  aborted: "Script aborted: {{message}}"
  sandboxFailed: "Script sandbox failed: {{message}}"
  truncatedWarning: "Warning: truncated output (original token count: {{tokens}})"
  lineCount: "Total output lines: {{count}}"
  truncatedBody: "{{head}}...{{tokens}} tokens truncated...{{tail}}"
  fullOutput: |-


    [Full output: {{path}} (read with offset/limit)]
  fullOutputFailed: |-


    [Could not save the full output: {{error}}]
  imageSaved: "[Image saved to {{path}} ({{kind}})]"
  imageSaveFailed: "[Image ({{kind}}) could not be saved: {{error}}]"
  outputLimit: script output exceeded the limit of {{characters}} characters or {{items}} text(), image(), and console calls. Print a summary instead, or write large data to a file with a tool.
  stalled: "The script is waiting on a promise that can never settle: no tool call is pending, and timers do not exist here."
models:
  classifierContext: '{ state: { ... }, images?: [{ type: "image", data: <base64>, mimeType }], questions: { <id>: { type: "choice", instructions, criteria: { <label>: <meaning> } } | { type: "score", instructions, criteria: [<lowest level>, ..., <highest level>] } | { type: "bool", instructions, criteria: { true: <meaning>, false: <meaning> } } } }'
  lookupArguments: '{{name}}(type, provider, id) expects three strings, got ({{values}}). The provider and the id are separate arguments, for example {{name}}("classifier", "typesafe", "jev-latest").'
  classifierError: '{{name}}() {{problem}}. Expected context: {{shape}}. See "Classify" in {{docsPath}}.'
  imagesError: '{{name}}() {{problem}}. Expected context: { input: [{ type: "text", text: <prompt> }, ...optional { type: "image", data: <base64>, mimeType } references] }. See "Generate images" in {{docsPath}}.'
  listAvailable: List the {{type}} models you can use with {{name}}("{{type}}").
  unknownLookup: " {{name}}() returns undefined for an unknown provider or id."
  expectedModel: "{{name}}() expects {{type}} model as its first argument, got {{value}}.{{undefinedHint}} {{listHint}}"
  wrongModelType: '"{{ref}}" is {{actualType}} model, not {{type}} model. {{listHint}}'
  unknownModel: Unknown {{type}} model "{{ref}}". {{listHint}}
  unknownType: Unknown model type {{value}}. Use "chat", "image", or "classifier".
discovery:
  toolHint: ALL_TOOLS lists every tool; searchTools(query) finds tools by topic.
  missingMember: "{{label}}.{{property}} does not exist."
  suggestions: " Did you mean {{names}}?"
  available: " Available: {{names}}."
  checkMember: '{{message}} Check for a member with "{{property}}" in {{label}}.'
store:
  hint: store() is for small state such as IDs or summaries. Show images with image(), keep large data in variables, or write it to a file with a tool.
  valueTooLarge: store({{key}}) value has {{size}} characters of JSON, more than the limit of {{limit}}. {{hint}}
  full: "store is full: stored values would exceed {{limit}} characters of JSON. Delete keys with store(key, undefined). {{hint}}"
images:
  expected: image expects a non-empty image URL string, an object with image_url, or a raw MCP image block
  invalidDataUri: invalid image output. Pass a base64 data URI instead
  remoteUrl: remote image URLs are not supported in tool outputs. Pass a base64 data URI instead
source:
  optionsObject: "@options must be a JSON object with supported fields {{fields}}"
  optionsJson: "@options must be valid JSON with supported fields {{fields}}: {{error}}"
  unsupportedOption: "@options only supports {{fields}}; got `{{key}}`"
  outputTokens: "@options field `max_output_tokens` must be a non-negative safe integer"
  timeout: "@options field `timeout_ms` must be a positive integer up to {{limit}}"
  empty: 'Expected JavaScript source text (non-empty). Provide JS only, optionally with a first line `// @options: {"max_output_tokens": 1000}`.'
  missingCode: The @options line must be followed by JavaScript source on subsequent lines
